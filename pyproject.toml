[project]
name = "ml-inference-service"
version = "0.1.0"
description = "REST inference API serving a scikit-learn churn model and Llama 3 via Ollama, with Prometheus latency metrics."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
