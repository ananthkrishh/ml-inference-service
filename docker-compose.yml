# Fleshed out in step 6 (healthchecks, resource limits, Grafana).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: models/churn_model.joblib
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama   # model weights survive container restarts

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

volumes:
  ollama-models:
