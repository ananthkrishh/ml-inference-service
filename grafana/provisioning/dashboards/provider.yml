# Grafana loads every dashboard JSON file in this folder at startup (dashboards as code).
apiVersion: 1

providers:
  - name: ml-inference
    folder: ML Inference Service
    type: file
    disableDeletion: true
    allowUiUpdates: false # edit the JSON in git, not in the UI
    options:
      path: /etc/grafana/provisioning/dashboards
